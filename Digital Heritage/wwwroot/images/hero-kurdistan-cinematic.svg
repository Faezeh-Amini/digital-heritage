<g clip-path="url(#portrait)">
<svg x="760" y="0" width="900" height="900" viewBox="0 0 600 1024" preserveAspectRatio="xMidYMid slice"><image href="/images/heritage/profile%202.jpg" x="0" y="0" width="1024" height="1024" preserveAspectRatio="none"/></svg>
<rect x="760" y="0" width="900" height="900" fill="url(#photoShade)"/>
</g>
