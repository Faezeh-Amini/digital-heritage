<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A living atlas of Kurdistan</title><desc id="desc">A cinematic collage using the project portrait of a Kurdish woman in a traditional black, white and red scarf, with layered Zagros terrain and a glowing cultural route.</desc>
<defs>
<linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111713"/><stop offset=".58" stop-color="#17221b"/><stop offset="1" stop-color="#080d0b"/></linearGradient>
<linearGradient id="photoShade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#111713" stop-opacity=".1"/><stop offset=".55" stop-color="#101511" stop-opacity=".05"/><stop offset="1" stop-color="#111713" stop-opacity=".38"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4dda5"/><stop offset="1" stop-color="#aa8043"/></linearGradient>
<linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4b5948"/><stop offset="1" stop-color="#121b16"/></linearGradient>
<linearGradient id="ridgeSide" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#28382e"/><stop offset="1" stop-color="#080d0b"/></linearGradient>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="skewX(-24)"><path d="M44 0H0V44" fill="none" stroke="#d9c28d" stroke-opacity=".13" stroke-width="1"/></pattern>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="22"/><feComponentTransfer><feFuncA type="linear" slope=".52"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="portrait"><path d="M800 28 1545 28 1605 666 1390 864 1124 828 808 602Z"/></clipPath>
</defs>
<rect width="1600" height="900" fill="url(#night)"/>
